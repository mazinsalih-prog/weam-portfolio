<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weam Ahmed · Graphic Designer</title>
<meta name="description" content="Portfolio of Weam Ahmed, graphic designer: branding, social media, print and exhibition design in Arabic and English.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=DM+Sans:wght@400;500;700&family=Syne:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="nav" id="nav">
  <a class="brand" href="#top" aria-label="Weam Ahmed">weam<span>.</span></a>
  <nav>
    <a href="#work" data-i="nav.work">Work</a>
    <a href="#about" data-i="nav.about">About</a>
    <a href="#contact" data-i="nav.contact">Contact</a>
    <button class="lang" id="lang" aria-label="Switch language">عربي</button>
  </nav>
</header>

<main id="top">
  <section class="hero">
    <div class="hero-text">
      <p class="kicker" id="h-kicker"></p>
      <h1 id="h-title"></h1>
      <p class="sub" id="h-sub"></p>
      <div class="cta-row">
        <a class="btn primary" href="#work" id="h-cta"></a>
        <a class="btn ghost" href="#contact" id="h-cta2"></a>
      </div>
    </div>
    <div class="hero-art" id="hero-art" aria-hidden="true"></div>
  </section>

  <div class="marquee" aria-hidden="true"><div class="track" id="marquee"></div></div>

  <section class="work" id="work">
    <div class="section-head">
      <h2 id="w-title"></h2>
      <p id="w-intro"></p>
    </div>
    <div id="projects"></div>
  </section>

  <section class="about" id="about">
    <div class="about-grid">
      <h2 id="a-title"></h2>
      <div class="about-text" id="a-text"></div>
    </div>
    <div class="services">
      <h3 id="s-title"></h3>
      <ul id="services"></ul>
    </div>
    <div class="clients">
      <h3 id="c-title"></h3>
      <ul id="clients"></ul>
    </div>
  </section>

  <section class="contact" id="contact">
    <h2 id="ct-title"></h2>
    <p id="ct-text"></p>
    <div class="cta-row center" id="ct-links"></div>
  </section>
</main>

<footer><span id="footer"></span></footer>

<div class="lightbox" id="lb" hidden>
  <button class="lb-close" id="lb-close" aria-label="Close">×</button>
  <button class="lb-nav prev" id="lb-prev" aria-label="Previous">‹</button>
  <img id="lb-img" alt="">
  <button class="lb-nav next" id="lb-next" aria-label="Next">›</button>
</div>

<script src="content.js"></script>
<script src="main.js"></script>
</body>
</html>
